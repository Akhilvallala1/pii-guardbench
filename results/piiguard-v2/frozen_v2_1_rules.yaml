version: 108
rules:
- name: ssn
  pattern: \b(?!000|666|9\d\d)\d{3}-(?!00)\d{2}-(?!0000)\d{4}\b
- name: email
  pattern: \b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b
- name: phone_us
  pattern: (?<!\d)(?:\+1[ .-]?)?(?:\(\d{3}\)|\d{3})[ .-]?\d{3}[ .-]?\d{4}\b
- name: credit_card
  pattern: \b(?:\d[ -]?){12,15}\d\b
  validator: luhn
- name: ssn_spaced
  pattern: \b\d(?:[\s\-‑\u2011\u00A0]+\d){8}\b
- name: phone_spaced
  pattern: \b(?:\+1[\s\-‑\u2011\u00A0]*)?\d(?:[\s\-‑\u2011\u00A0]+\d){9}\b
- name: credit_card_spaced
  pattern: \b\d(?:[\s\-‑\u2011\u00A0]+\d){12,18}\b
  validator: luhn
- name: dob_spaced
  pattern: \b\d{2}[\s\-‑/\u2011\u00A0]+\d{2}[\s\-‑/\u2011\u00A0]+\d{4}\b
- name: fullwidth_digits
  pattern: '[\uFF10-\uFF19]+(?:[\s\-‑/\u2011\u00A0]+[\uFF10-\uFF19]+)+'
- name: spelled_digits
  ignore_case: true
  pattern: \b(?:zero|one|two|three|four|five|six|seven|eight|nine)(?:\s+(?:(?:-|dash)\s+)?(?:zero|one|two|three|four|five|six|seven|eight|nine)){3,}\b
- name: split_line_digits
  pattern: \b\d(?:\n\d)+\b
- name: unicode_separator_digits
  pattern: \b\d(?:[\u2011\u00A0]+\d)+\b
- name: url_encoded
  pattern: (?:%[0-9A-Fa-f]{2})+
  validator: decodes_to_pii_url
- name: base64_ssn
  pattern: (?<=ssn=)[A-Za-z0-9+/]+={0,2}|(?<=ssn:\s)[A-Za-z0-9+/]+={0,2}
- name: base64_phone
  pattern: (?<=phone=)[A-Za-z0-9+/]+={0,2}|(?<=phone:\s)[A-Za-z0-9+/]+={0,2}
- name: base64_credit_card
  pattern: (?<=credit_card=)[A-Za-z0-9+/]+={0,2}|(?<=credit_card:\s)[A-Za-z0-9+/]+={0,2}
- name: base64_dob
  pattern: (?<=dob=)[A-Za-z0-9+/]+={0,2}|(?<=dob:\s)[A-Za-z0-9+/]+={0,2}
- name: base64_email
  pattern: (?<=email=)[A-Za-z0-9+/]+={0,2}|(?<=email:\s)[A-Za-z0-9+/]+={0,2}
- name: hex_ssn
  pattern: (?<=ssn=)[0-9a-fA-F]+|(?<=ssn:\s)[0-9a-fA-F]+
- name: hex_phone
  pattern: (?<=phone=)[0-9a-fA-F]+|(?<=phone:\s)[0-9a-fA-F]+
- name: hex_credit_card
  pattern: (?<=credit_card=)[0-9a-fA-F]+|(?<=credit_card:\s)[0-9a-fA-F]+
- name: hex_dob
  pattern: (?<=dob=)[0-9a-fA-F]+|(?<=dob:\s)[0-9a-fA-F]+
- name: generic_base64_pii
  pattern: '[A-Za-z0-9+/]{12,}(?:={0,2})'
  validator: decodes_to_pii_base64
- name: generic_hex_pii
  pattern: '[0-9a-fA-F]{12,}'
  validator: decodes_to_pii_hex
- name: generic_reversed_pii
  pattern: \b\d(?:[\s\-‑\u2011\u00A0]+\d){2,}\b
  validator: reversed_is_pii
- name: adjuster_badge
  pattern: \bADJ[-‑]\d{5}[-‑][A-Z]{2}\b
- name: claim_number
  pattern: \bCLM[-‑]\d{4}[-‑]\d{6,7}\b
- name: policy_number
  pattern: \b[A-Z]{3}[\s\-‑]\d{2}[\s\-‑]\d{4}[\s\-‑]\d{4}\b
- name: split_line_identifier
  pattern: \b(?:ADJ|CLM)\n\d{2,5}\n(?:\d{4,7}|[A-Z]{2})\b
- name: reversed_claim_number
  pattern: \b\d{7}[-‑]\d{4}[-‑][A-Z]{3}\b
  validator: reversed_is_pii
- name: reversed_adjuster_badge
  pattern: \b[A-Z]{2}[-‑]\d{5}[-‑][A-Z]{3}\b
  validator: reversed_is_pii
- name: ssn
  pattern: '(?<=\b(?i:ssn|social security(?: number)?|social)\b[^\n]{0,60}?)(?<![\w-])\d[\d-]{2,9}\d(?![\w-])'
- name: zero_width_laced
  pattern: '[^\s\u200b\u200c\u200d\u2060]{1,4}(?:[\u200b\u200c\u200d\u2060][^\s\u200b\u200c\u200d\u2060]{1,4}){3,}'
- name: api_key_prefixed
  pattern: \b(?:sk|rk|pk)_(?:test|live)_[A-Za-z0-9_-]{6,}
- name: token_prefixed
  pattern: \b(?:gh[pousr]_|github_pat_|xox[abprs]-)[A-Za-z0-9_-]{6,}
- name: secret_assignment
  pattern: (?<=(?i:api[_-]?key|secret[_-]?key|access[_-]?token|auth[_-]?token)\s*[:=]\s*)[^\s,;]{12,}
- name: password_context
  pattern: (?<=(?i:(?<![A-Za-z])pass(?:word|wd|phrase)?|\bpwd)(?:\s+(?:is|was|to|of)|\s*[:=])?\s+|(?i:(?<![A-Za-z])pass(?:word|wd)?)[:=])(?=[^\s,;]*[\d!@#$%^&*?+=])[^\s,;]{6,}?(?=[,;.)]?(?:\s|$))
- name: mrn_prefixed
  pattern: \bMRN[-#:]?\s?\d{5,12}\b
- name: mrn_context
  pattern: '(?<=\b(?i:mrn|medical record(?: number)?|record|chart(?:s)?(?: number)?|patient
    id)\s*(?:#|no\.?|number)?\s*[:#]?\s*)(?=[A-Z0-9-]*\d)[A-Z0-9][A-Z0-9-]{4,15}[A-Z0-9]\b'
- name: icd10_dotted
  pattern: \b[A-TV-Z]\d[0-9A-Z]\.[0-9A-Z]{1,4}\b
- name: icd10_context
  pattern: (?<=\b(?i:diagnosis|diagnosed with|dx|icd-?10(?:-cm)?)\s*(?:code)?\s*[:#]?\s*)[A-TV-Z]\d[0-9A-Z]\b
- name: account_context
  pattern: (?<=\b(?i:account|acct|a/c)\.?(?:\s+(?:number|no\.?|#))?\s*[:#]?\s*)\d(?:[
    -]?\d){5,16}\b
- name: name_context
  pattern: (?<=\b(?:[Pp]atient|[Aa]pplicant|[Mm]ember|[Aa]ccountant|[Oo]wner|[Cc]ontact|[Bb]elonging
    to|[Tt]his is|[Nn]ame is|[Nn]ame:|Mr\.|Ms\.|Mrs\.|Dr\.)\s+)[A-Z][a-z]+(?:[ -][A-Z][a-z]+){1,2}\b
- name: name_after_preposition
  pattern: (?<=\b(?:for|give|by|with|from|to|call|Hi)\s+)[A-Z][a-z]{2,}\s[A-Z][a-z]{2,}\b(?!\s+(?:Street|St|Ave|Road|Inc|LLC|Corp|University|Hospital|Clinic)\b)
- name: name_sentence_subject
  pattern: (?<=(?:^|[.:!?]\s+))[A-Z][a-z]{2,}\s[A-Z][a-z]{2,}(?=\s+(?:has|is|was|will|should|called|said|needs|wants|asked)\b)
